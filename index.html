<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SITTA Universitas Terbuka</title>
  <meta name="description" content="Halaman login Sistem Informasi Tiras dan Distribusi Bahan Ajar (SITTA) Universitas Terbuka.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <!-- ======== FORM LOGIN ======== -->
  <div class="login-card">
    <h2>Selamat Datang</h2>

    <!-- Alert Notifikasi -->
    <div id="loginAlert" class="alert-box alert-danger" style="display:none;">
      <span id="loginAlertText">email/password yang anda masukkan salah</span>
    </div>

    <form id="formLogin" novalidate>

      <!-- Input Email -->
      <div class="form-group">
        <div class="form-input-row">
          <span class="input-icon">&#9993;</span>
          <input type="email" id="inputEmail" name="email" placeholder="Email" required autocomplete="email">
        </div>
      </div>

      <!-- Input Password -->
      <div class="form-group">
        <div class="form-input-row">
          <span class="input-icon">&#128273;</span>
          <input type="password" id="inputPassword" name="password" placeholder="Password" required autocomplete="current-password">
        </div>
      </div>

      <!-- Lupa Password -->
      <div class="forgot-row">
        <button type="button" id="btnLupaPassword" class="link-btn">Lupa password ?</button>
      </div>

      <!-- Tombol Masuk -->
      <button type="submit" id="btnMasuk" class="btn-masuk">Masuk</button>

    </form>

    <!-- Daftar -->
    <div class="login-footer">
      <span>Belum punya akun?</span>
      <button type="button" id="btnDaftar" class="link-btn" style="margin-left:6px;">Daftar</button>
    </div>
  </div>

  <!-- ======== MODAL: LUPA PASSWORD ======== -->
  <div id="modalLupaPassword" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Lupa Password</h3>
        <button type="button" class="modal-close" onclick="tutupModal('modalLupaPassword')">&times;</button>
      </div>
      <form id="formLupaPassword">
        <div class="modal-body">
          <p>Masukkan email yang terdaftar. Link reset password akan dikirim ke email Anda.</p>
          <div class="form-group">
            <label class="form-label" for="inputResetEmail">Email Terdaftar</label>
            <input type="email" id="inputResetEmail" class="form-control" placeholder="Email anda" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="tutupModal('modalLupaPassword')">Batal</button>
          <button type="submit" class="btn btn-yellow">Kirim</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ======== MODAL: DAFTAR AKUN ======== -->
  <div id="modalDaftar" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Daftar Akun Baru</h3>
        <button type="button" class="modal-close" onclick="tutupModal('modalDaftar')">&times;</button>
      </div>
      <form id="formDaftar">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="regNama">Nama Lengkap *</label>
            <input type="text" id="regNama" class="form-control" placeholder="Nama Lengkap" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regRole">Peran / Role *</label>
            <select id="regRole" class="form-control" required>
              <option value="UPBJJ-UT">UPBJJ-UT</option>
              <option value="Puslaba">Puslaba</option>
              <option value="Fakultas">Fakultas</option>
              <option value="Mahasiswa">Mahasiswa</option>
              <option value="Administrator">Administrator</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="regEmail">Email *</label>
            <input type="email" id="regEmail" class="form-control" placeholder="Email" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="regPassword">Password *</label>
            <input type="password" id="regPassword" class="form-control" placeholder="Minimal 6 karakter" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="tutupModal('modalDaftar')">Batal</button>
          <button type="submit" class="btn btn-yellow">Daftar Sekarang</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
