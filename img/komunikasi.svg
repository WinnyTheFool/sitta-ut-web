<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgKomp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="60%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  
  <rect width="300" height="420" rx="8" fill="url(#bgKomp)"/>
  <rect x="0" y="0" width="14" height="420" fill="rgba(0,0,0,0.2)"/>
  <line x1="14" y1="0" x2="14" y2="420" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Top Header Band -->
  <rect x="24" y="24" width="252" height="46" rx="6" fill="#ffffff"/>
  <circle cx="48" cy="47" r="14" fill="#6d28d9"/>
  <text x="48" y="52" fill="#ffd000" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14" text-anchor="middle">UT</text>
  <text x="72" y="42" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="11">BUKU MATERI POKOK</text>
  <text x="72" y="56" fill="#7c3aed" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="9" letter-spacing="1">UNIVERSITAS TERBUKA</text>

  <!-- Code & SKS Tag -->
  <rect x="24" y="90" width="130" height="26" rx="4" fill="#ffd000"/>
  <text x="89" y="107" fill="#002855" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12" text-anchor="middle">SKOM4101 / 3 SKS</text>

  <!-- Title -->
  <text x="24" y="145" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="20">PENGANTAR</text>
  <text x="24" y="172" fill="#e9d5ff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="21">ILMU KOMUNIKASI</text>
  <text x="24" y="195" fill="#c4b5fd" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12">EDISI 3 - ERA DIGITAL</text>

  <!-- Illustration: Communication Network & Speech Bubbles -->
  <g transform="translate(60, 220)">
    <!-- Main Chat bubble -->
    <rect x="15" y="10" width="120" height="70" rx="14" fill="#ffffff" opacity="0.95"/>
    <polygon points="40,80 30,95 55,80" fill="#ffffff" opacity="0.95"/>
    <!-- Nested chat bubble -->
    <rect x="70" y="45" width="95" height="55" rx="12" fill="#ffd000"/>
    <polygon points="135,100 145,112 125,100" fill="#ffd000"/>
    <!-- Signal dots -->
    <circle cx="45" cy="45" r="5" fill="#7c3aed"/>
    <circle cx="65" cy="45" r="5" fill="#7c3aed"/>
    <circle cx="85" cy="45" r="5" fill="#7c3aed"/>
    <circle cx="100" cy="73" r="4" fill="#002855"/>
    <circle cx="118" cy="73" r="4" fill="#002855"/>
    <circle cx="136" cy="73" r="4" fill="#002855"/>
  </g>

  <!-- Author & Bottom Bar -->
  <line x1="24" y1="365" x2="276" y2="365" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="24" y="385" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11">Prof. Deddy Mulyana, M.A., Ph.D.</text>
  <text x="24" y="400" fill="#ddd6fe" font-family="'Segoe UI', sans-serif" font-size="9">Fakultas Hukum, Ilmu Sosial dan Ilmu Politik (FHISIP)</text>
</svg>
