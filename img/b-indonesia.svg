  <text x="24" y="385" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11">Drs. M. Yunus, M.Pd.</text>
  <text x="24" y="400" fill="#fca5a5" font-family="'Segoe UI', sans-serif" font-size="9">Fakultas Keguruan dan Ilmu Pendidikan (FKIP)</text>
