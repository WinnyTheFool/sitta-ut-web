  <rect x="24" y="90" width="130" height="26" rx="4" fill="#ffd000"/>
  <text x="89" y="107" fill="#002855" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12" text-anchor="middle">MKDU4110 / 3 SKS</text>

