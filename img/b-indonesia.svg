  <g transform="translate(85, 230)">
    <path d="M 10,70 Q 65,45 65,75 Q 65,45 120,70 L 120,45 Q 65,20 65,50 Q 65,20 10,45 Z" fill="#ffffff" opacity="0.95"/>
