  <text x="24" y="180" fill="#fef08a" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="24">INDONESIA</text>
  <text x="24" y="202" fill="#fca5a5" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12">EDISI 2 - KARYA ILMIAH</text>

