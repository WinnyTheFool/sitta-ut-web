<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  
  <!-- Base Cover & Spine Highlight -->
  <rect width="300" height="420" rx="8" fill="url(#bgGrad)"/>
  <rect width="300" height="420" rx="8" fill="url(#gridPattern)"/>
  <rect x="0" y="0" width="14" height="420" fill="rgba(0,0,0,0.2)"/>
  <line x1="14" y1="0" x2="14" y2="420" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Top Header Band -->
  <rect x="24" y="24" width="252" height="46" rx="6" fill="#ffffff"/>
  <circle cx="48" cy="47" r="14" fill="#0369a1"/>
  <text x="48" y="52" fill="#ffd000" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14" text-anchor="middle">UT</text>
  <text x="72" y="42" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="11">BUKU MATERI POKOK</text>
  <text x="72" y="56" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="9" letter-spacing="1">UNIVERSITAS TERBUKA</text>

  <!-- Code & SKS Tag -->
  <rect x="24" y="90" width="130" height="26" rx="4" fill="#ffd000"/>
  <text x="89" y="107" fill="#002855" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12" text-anchor="middle">MSIM4201 / 3 SKS</text>

  <!-- Title -->
  <text x="24" y="150" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="24">SISTEM</text>
  <text x="24" y="180" fill="#ffd000" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="24">BASIS DATA</text>
  <text x="24" y="202" fill="#bae6fd" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12">EDISI 3 - REVISI TERBARU</text>

  <!-- Illustration: Database Server Stacks -->
  <g transform="translate(70, 220)">
    <!-- Cylinder 1 -->
    <ellipse cx="80" cy="30" rx="65" ry="16" fill="#38bdf8"/>
    <rect x="15" y="30" width="130" height="28" fill="#0284c7"/>
    <ellipse cx="80" cy="58" rx="65" ry="16" fill="#38bdf8"/>
    <!-- Cylinder 2 -->
    <rect x="15" y="58" width="130" height="28" fill="#0369a1"/>
    <ellipse cx="80" cy="86" rx="65" ry="16" fill="#38bdf8"/>
    <!-- Cylinder 3 -->
    <rect x="15" y="86" width="130" height="28" fill="#0c4a6e"/>
    <ellipse cx="80" cy="114" rx="65" ry="16" fill="#38bdf8"/>
    <!-- LED Indicators -->
    <circle cx="125" cy="44" r="3.5" fill="#4ade80"/>
    <circle cx="125" cy="72" r="3.5" fill="#4ade80"/>
    <circle cx="125" cy="100" r="3.5" fill="#4ade80"/>
  </g>

  <!-- Author & Bottom Bar -->
  <line x1="24" y1="365" x2="276" y2="365" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="24" y="385" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11">Dr. Bambang Hariyanto, M.T.</text>
  <text x="24" y="400" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">Fakultas Sains dan Teknologi (FST)</text>
</svg>
