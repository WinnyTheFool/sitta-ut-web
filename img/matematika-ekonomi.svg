<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMatek" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
  </defs>
  
  <rect width="300" height="420" rx="8" fill="url(#bgMatek)"/>
  <rect x="0" y="0" width="14" height="420" fill="rgba(0,0,0,0.2)"/>
  <line x1="14" y1="0" x2="14" y2="420" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Top Header Band -->
  <rect x="24" y="24" width="252" height="46" rx="6" fill="#ffffff"/>
  <circle cx="48" cy="47" r="14" fill="#c2410c"/>
  <text x="48" y="52" fill="#ffd000" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14" text-anchor="middle">UT</text>
  <text x="72" y="42" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="11">BUKU MATERI POKOK</text>
  <text x="72" y="56" fill="#ea580c" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="9" letter-spacing="1">UNIVERSITAS TERBUKA</text>

  <!-- Code & SKS Tag -->
  <rect x="24" y="90" width="130" height="26" rx="4" fill="#ffd000"/>
  <text x="89" y="107" fill="#002855" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12" text-anchor="middle">ESPA4122 / 3 SKS</text>

  <!-- Title -->
  <text x="24" y="145" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="21">MATEMATIKA</text>
  <text x="24" y="172" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="22">EKONOMI</text>
  <text x="24" y="195" fill="#ffedd5" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12">EDISI 2 - ANALISIS KUANTITATIF</text>

  <!-- Illustration: Math Functions & Curves -->
  <g transform="translate(60, 220)">
    <rect x="0" y="0" width="180" height="110" rx="8" fill="#ffffff" opacity="0.95"/>
    <line x1="20" y1="90" x2="160" y2="90" stroke="#94a3b8" stroke-width="2"/>
    <line x1="20" y1="90" x2="20" y2="15" stroke="#94a3b8" stroke-width="2"/>
    <!-- Curve Demand & Supply -->
    <path d="M 25,25 Q 70,75 155,85" fill="none" stroke="#ea580c" stroke-width="3"/>
    <path d="M 25,80 Q 80,45 155,20" fill="none" stroke="#0284c7" stroke-width="3"/>
    <!-- Equilibrium Point -->
    <circle cx="88" cy="55" r="5" fill="#f59e0b"/>
    <text x="96" y="52" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="10">E(P*, Q*)</text>
  </g>

  <!-- Author & Bottom Bar -->
  <line x1="24" y1="365" x2="276" y2="365" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="24" y="385" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11">Dr. Sonny Harry B. Harmadi</text>
  <text x="24" y="400" fill="#fed7aa" font-family="'Segoe UI', sans-serif" font-size="9">Fakultas Ekonomi dan Bisnis (FEB)</text>
</svg>
