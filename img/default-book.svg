  <text x="24" y="195" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12">EDISI TERKINI</text>

  <!-- Illustration: Open Book with Star -->
  <g transform="translate(80, 220)">
    <path d="M 10,75 Q 70,50 70,80 Q 70,50 130,75 L 130,40 Q 70,15 70,45 Q 70,15 10,40 Z" fill="#ffffff" opacity="0.9"/>
    <polygon points="70,10 74,22 86,22 76,30 80,42 70,34 60,42 64,30 54,22 66,22" fill="#ffd000"/>
  </g>

