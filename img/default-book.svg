  <text x="24" y="385" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11">Tim Pengembang Bahan Ajar</text>
  <text x="24" y="400" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="9">Universitas Terbuka Republik Indonesia</text>
