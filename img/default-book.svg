<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDef" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  
  <rect width="300" height="420" rx="8" fill="url(#bgDef)"/>
  <rect x="0" y="0" width="14" height="420" fill="rgba(0,0,0,0.3)"/>
  <line x1="14" y1="0" x2="14" y2="420" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Top Header Band -->
  <rect x="24" y="24" width="252" height="46" rx="6" fill="#ffffff"/>
  <circle cx="48" cy="47" r="14" fill="#003580"/>
  <text x="48" y="52" fill="#ffd000" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14" text-anchor="middle">UT</text>
  <text x="72" y="42" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="11">BUKU MATERI POKOK</text>
  <text x="72" y="56" fill="#0284c7" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="9" letter-spacing="1">UNIVERSITAS TERBUKA</text>

  <!-- Code & SKS Tag -->
  <rect x="24" y="90" width="140" height="26" rx="4" fill="#ffd000"/>
  <text x="94" y="107" fill="#002855" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12" text-anchor="middle">BMP TERBARU</text>

  <!-- Title -->
  <text x="24" y="145" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="22">MODUL BAHAN</text>
