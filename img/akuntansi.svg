<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAkun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  
  <rect width="300" height="420" rx="8" fill="url(#bgAkun)"/>
  <rect x="0" y="0" width="14" height="420" fill="rgba(0,0,0,0.2)"/>
  <line x1="14" y1="0" x2="14" y2="420" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Top Header Band -->
  <rect x="24" y="24" width="252" height="46" rx="6" fill="#ffffff"/>
  <circle cx="48" cy="47" r="14" fill="#047857"/>
  <text x="48" y="52" fill="#ffd000" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="14" text-anchor="middle">UT</text>
  <text x="72" y="42" fill="#0f172a" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="11">BUKU MATERI POKOK</text>
  <text x="72" y="56" fill="#059669" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="9" letter-spacing="1">UNIVERSITAS TERBUKA</text>

  <!-- Code & SKS Tag -->
  <rect x="24" y="90" width="130" height="26" rx="4" fill="#ffd000"/>
  <text x="89" y="107" fill="#002855" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="12" text-anchor="middle">EKMA4115 / 4 SKS</text>

  <!-- Title -->
  <text x="24" y="150" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="23">PENGANTAR</text>
  <text x="24" y="180" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="24">AKUNTANSI</text>
  <text x="24" y="202" fill="#6ee7b7" font-family="'Segoe UI', sans-serif" font-weight="600" font-size="12">EDISI 4 - KOMPREHENSIF</text>

  <!-- Illustration: Finance Chart / Ledger -->
  <g transform="translate(60, 225)">
    <!-- Ledger Sheet -->
    <rect x="0" y="0" width="180" height="110" rx="8" fill="#ffffff" opacity="0.95"/>
    <rect x="15" y="15" width="150" height="10" rx="3" fill="#10b981"/>
    <rect x="15" y="32" width="70" height="6" rx="2" fill="#cbd5e1"/>
    <rect x="95" y="32" width="70" height="6" rx="2" fill="#cbd5e1"/>
    <!-- Bar Graph -->
    <rect x="30" y="70" width="18" height="25" rx="2" fill="#34d399"/>
    <rect x="60" y="55" width="18" height="40" rx="2" fill="#10b981"/>
    <rect x="90" y="45" width="18" height="50" rx="2" fill="#059669"/>
    <rect x="120" y="60" width="18" height="35" rx="2" fill="#047857"/>
    <!-- Growth Line -->
    <polyline points="39,65 69,50 99,40 129,55" fill="none" stroke="#f59e0b" stroke-width="3"/>
  </g>

  <!-- Author & Bottom Bar -->
  <line x1="24" y1="365" x2="276" y2="365" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="24" y="385" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11">Prof. Dr. Slamet Sugiri, M.B.A.</text>
  <text x="24" y="400" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="9">Fakultas Ekonomi dan Bisnis (FEB)</text>
</svg>
